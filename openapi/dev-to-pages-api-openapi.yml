openapi: 3.2.0
info:
  title: Dev To Pages API
  version: 1.0.0
  description: 'Operations tagged Pages across 3 of this provider''s published API definitions: dev-to-forem-api-openapi.yml, dev-to-forem-api-v1-openapi.json, devto-pages-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev.to/api
  description: Dev.to Production Server
- url: https://dev.to
  description: Production server
tags:
- name: Pages
  description: Endpoints for managing static pages on the platform. Requires admin-level API key.
paths:
  /pages:
    get:
      operationId: getPages
      summary: Show details for all pages
      description: Retrieves all static pages on the platform. Requires admin-level API key.
      tags:
      - Pages
      responses:
        '200':
          description: A list of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    post:
      operationId: createPage
      summary: Create a new page
      description: Creates a new static page. Requires admin-level API key.
      tags:
      - Pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Page'
      responses:
        '201':
          description: Page created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable Entity
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /pages/{id}:
    get:
      operationId: getPageById
      summary: Show details for a page
      description: Retrieves a single static page by ID. Requires admin-level API key.
      tags:
      - Pages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the page.
      responses:
        '200':
          description: The requested page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          description: Unauthorized
        '404':
          description: Page not found
      security:
      - apiKey: []
    put:
      operationId: updatePage
      summary: Update details for a page
      description: Updates an existing static page. Requires admin-level API key.
      tags:
      - Pages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Page'
      responses:
        '200':
          description: Page updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          description: Unauthorized
        '404':
          description: Page not found
        '422':
          description: Unprocessable Entity
      security:
      - apiKey: []
    delete:
      operationId: deletePage
      summary: Remove a page
      description: Deletes a static page by ID. Requires admin-level API key.
      tags:
      - Pages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the page.
      responses:
        '204':
          description: Page deleted
        '401':
          description: Unauthorized
        '404':
          description: Page not found
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/pages:
    get:
      summary: show details for all pages
      security: []
      tags:
      - Pages
      description: 'Retrieve details for all Page objects in the system.


        ### Pages Overview:

        - Pages are custom static or dynamic views hosted on the Forem instance.

        - Publicly visible unless restricted.

        - Helpful for building custom menus, rendering site policies, or embedding custom forms.'
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page_2'
      operationId: getApiPages
      x-operation-id-source: derived
    post:
      summary: pages
      tags:
      - Pages
      description: 'Create a new custom page. Requires administrative privileges.


        ### Body Parameter Guidelines:

        - **title**: Heading displayed at the top of the page.

        - **slug**: URL path identifier. Must be unique and URL-safe.

        - **body_markdown**: Content written in Markdown format.

        - **body_json**: Optional JSON payload for API-consumed/structured data pages.

        - **is_top_level_path**: Set to `true` to serve the page directly at the root (e.g. `/{slug}`) instead of under the default namespace `/page/{slug}`. Use with caution to avoid namespace collisions with core Forem paths.

        - **template**: Layout styling options (`contained` or custom layouts).'
      parameters: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
        '422':
          description: unprocessable
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Title of the page
                slug:
                  type: string
                  description: Used to link to this page in URLs, must be unique and URL-safe
                description:
                  type: string
                  description: For internal use, helps similar pages from one another
                body_markdown:
                  type: string
                  description: The text (in markdown) of the page (required)
                body_json:
                  type: string
                  description: For JSON pages, the JSON body
                is_top_level_path:
                  type: boolean
                  description: If true, the page is available at '/{slug}' instead of '/page/{slug}', use with caution
                template:
                  type: string
                  enum:
                  - contained
                  - full_within_layout
                  - nav_bar_included
                  - json
                  - css
                  - txt
                  default: contained
                  description: Controls what kind of layout the page is rendered in
        description: Page parameters.
      security:
      - api-key: []
      - bearer_auth: []
      operationId: postApiPages
      x-operation-id-source: derived
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/pages/{id}:
    get:
      summary: show details for a page
      security: []
      tags:
      - Pages
      description: Retrieve details for a single Page object specified by ID.
      parameters:
      - name: id
        in: path
        required: true
        description: The unique ID of the page.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_2'
      operationId: getApiPagesById
      x-operation-id-source: derived
    put:
      summary: update details for a page
      tags:
      - Pages
      description: Update an existing page's details by ID. Requires administrative privileges.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the page to update.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_2'
        '401':
          description: unauthorized
        '422':
          description: unprocessable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Page_2'
        description: Representation of Page to be updated
      security:
      - api-key: []
      - bearer_auth: []
      operationId: putApiPagesById
      x-operation-id-source: derived
    delete:
      summary: remove a page
      tags:
      - Pages
      description: Delete a custom page from the system by ID. Requires administrative privileges.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the page to delete.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_2'
        '401':
          description: unauthorized
        '422':
          description: unprocessable
      security:
      - api-key: []
      - bearer_auth: []
      operationId: deleteApiPagesById
      x-operation-id-source: derived
    servers:
    - url: https://dev.to/api
      description: Production server
components:
  schemas:
    Page:
      type: object
      description: A static page on the platform, managed by administrators.
      properties:
        id:
          type: integer
          description: The unique identifier of the page.
        title:
          type: string
          description: The title of the page.
        slug:
          type: string
          description: The URL slug of the page.
        description:
          type: string
          description: A description of the page.
        body_markdown:
          type: string
          description: The page content in Markdown format.
        body_json:
          type: string
          nullable: true
          description: The page content in JSON format, if applicable.
        is_top_level_path:
          type: boolean
          description: Whether the page is accessible at a top-level URL path.
        social_image:
          type: object
          nullable: true
          description: Social image configuration for the page.
        template:
          type: string
          description: The template used to render the page.
    Page_2:
      description: Representation of a page object
      type: object
      properties:
        title:
          type: string
          description: Title of the page
        slug:
          type: string
          description: Used to link to this page in URLs, must be unique and URL-safe
        description:
          type: string
          description: For internal use, helps similar pages from one another
        body_markdown:
          type:
          - string
          - 'null'
          description: The text (in markdown) of the ad (required)
        body_json:
          type:
          - string
          - 'null'
          description: For JSON pages, the JSON body
        is_top_level_path:
          type: boolean
          description: If true, the page is available at '/{slug}' instead of '/page/{slug}', use with caution
        social_image:
          type:
          - object
          - 'null'
        template:
          type: string
          enum:
          - contained
          - full_within_layout
          - nav_bar_included
          - json
          - css
          - txt
          default: contained
          description: Controls what kind of layout the page is rendered in
      required:
      - title
      - slug
      - description
      - template
    Page_3:
      description: Representation of a page object
      type: object
      properties:
        title:
          type: string
          description: Title of the page
        slug:
          type: string
          description: Used to link to this page in URLs, must be unique and URL-safe
        description:
          type: string
          description: For internal use, helps similar pages from one another
        body_markdown:
