          - string
          - 'null'
          description: The text (in markdown) of the ad (required)
        body_json:
          type:
          - string
          - 'null'
          description: For JSON pages, the JSON body
        is_top_level_path:
          type: boolean
          description: If true, the page is available at '/{slug}' instead of '/page/{slug}', use with caution
        social_image:
          type:
          - object
          - 'null'
        template:
          type: string
          enum:
          - contained
          - full_within_layout
          - nav_bar_included
          - json
          - css
