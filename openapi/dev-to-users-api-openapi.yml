openapi: 3.2.0
info:
  title: Dev To Users API
  version: 1.0.0
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: dev-to-forem-api-openapi.yml, dev-to-forem-api-v1-openapi.json, devto-users-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev.to/api
  description: Dev.to Production Server
- url: https://dev.to
  description: Production server
tags:
- name: Users
  description: Endpoints for retrieving user profiles and managing user accounts.
paths:
  /articles/me:
    get:
      operationId: getUserArticles
      summary: User's articles
      description: Retrieves all articles authored by the authenticated user.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of the authenticated user's articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me/published:
    get:
      operationId: getUserPublishedArticles
      summary: User's published articles
      description: Retrieves only published articles authored by the authenticated user.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of the authenticated user's published articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me/unpublished:
    get:
      operationId: getUserUnpublishedArticles
      summary: User's unpublished articles
      description: Retrieves only unpublished (draft) articles authored by the authenticated user.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of the authenticated user's unpublished articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me/all:
    get:
      operationId: getUserAllArticles
      summary: User's all articles
      description: Retrieves all articles (both published and unpublished) authored by the authenticated user.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of all the authenticated user's articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /organizations/{username}/users:
    get:
      operationId: getOrgUsers
      summary: Organization's users
      description: Retrieves a list of users belonging to the specified organization.
      tags:
      - Users
      security: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: The username (slug) of the organization.
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of organization members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Organization not found
    servers:
    - url: https://dev.to/api
      description: Production server
  /users/me:
    get:
      operationId: getUserMe
      summary: The authenticated user
      description: Retrieves the profile of the currently authenticated user.
      tags:
      - Users
      responses:
        '200':
          description: The authenticated user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /users/{id}:
    get:
      operationId: getUser
      summary: A User
      description: Retrieves a single user by their numeric ID.
      tags:
      - Users
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the user.
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    servers:
    - url: https://dev.to/api
      description: Production server
  /users/{id}/unpublish:
    put:
      operationId: unpublishUser
      summary: Unpublish a User's Articles and Comments
      description: Unpublishes all articles and comments for the specified user. Requires admin-level API key.
      tags:
      - Users
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the user.
      responses:
        '204':
          description: User content unpublished successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /users/{id}/suspend:
    put:
      operationId: suspendUser
      summary: Suspend a User
      description: Suspends a user account. Requires admin-level API key.
      tags:
      - Users
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the user.
      responses:
        '204':
          description: User suspended successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me:
    get:
      summary: User's articles
      tags:
      - Users
      description: 'This endpoint allows the client to retrieve a list of published articles on behalf of an authenticated user.


        "Articles" are all the posts that users create on DEV that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but is referred to as article within the code.


        Published articles will be in reverse chronological publication order.


        It will return published articles with pagination. By default a page will contain 30 articles.'
      operationId: getApiArticlesMe
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '401':
          description: Unauthorized
        '200':
          description: A List of the authenticated user's Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me/published:
    get:
      summary: User's published articles
      tags:
      - Users
      description: 'This endpoint allows the client to retrieve a list of published articles on behalf of an authenticated user.


        "Articles" are all the posts that users create on DEV that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but is referred to as article within the code.


        Published articles will be in reverse chronological publication order.


        It will return published articles with pagination. By default a page will contain 30 articles.'
      operationId: getApiArticlesMePublished
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '401':
          description: Unauthorized
        '200':
          description: A List of the authenticated user's Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserPublishedArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me/unpublished:
    get:
      summary: User's unpublished articles
      tags:
      - Users
      description: 'This endpoint allows the client to retrieve a list of unpublished articles on behalf of an authenticated user.


        "Articles" are all the posts that users create on DEV that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but is referred to as article within the code.


        Unpublished articles will be in reverse chronological creation order.


        It will return unpublished articles with pagination. By default a page will contain 30 articles.'
      operationId: getApiArticlesMeUnpublished
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '401':
          description: Unauthorized
        '200':
          description: A List of the authenticated user's Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserUnpublishedArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me/all:
    get:
      summary: User's all articles
      tags:
      - Users
      description: 'This endpoint allows the client to retrieve a list of all articles on behalf of an authenticated user.


        "Articles" are all the posts that users create on DEV that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but is referred to as article within the code.


        It will return both published and unpublished articles with pagination.


        Unpublished articles will be at the top of the list in reverse chronological creation order. Published articles will follow in reverse chronological publication order.


        By default a page will contain 30 articles.'
      operationId: getApiArticlesMeAll
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '401':
          description: Unauthorized
        '200':
          description: A List of the authenticated user's Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserAllArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/organizations/{organization_id_or_username}/users:
    get:
      summary: Organization's users
      tags:
      - Users
      security: []
      description: 'Retrieve a list of public user profiles associated with the organization.


        ### Path Parameter Options:

        - **organization_id_or_username**: Supports either the organization''s unique numerical ID OR its string username (slug).

        - Ideal for displaying team member directory lists on organization/brand pages.'
      operationId: getApiOrganizationsByOrganizationIdOrUsernameUsers
      parameters:
      - name: organization_id_or_username
        in: path
        required: true
        description: The organization's numerical ID or string username.
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '200':
          description: An Organization's users (with ID)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User_2'
        '404':
          description: Not Found
      x-operation-id-source: normalized
      x-operation-id-original: getOrgUsers
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/{id}/suspend:
    put:
      summary: Suspend a User
      tags:
      - Users
      description: 'Suspend a user''s account.


        ### Suspension Details:

        - The user associated with the API key must have an `admin` or `moderator` role.

        - Assigns the `suspended` role to the user, preventing them from posting new content (articles or comments) while suspended.

        - Existing content is not deleted.

        - Suspended users are not notified in the UI; if you want them to know, you must notify them explicitly.'
      operationId: putApiUsersByIdSuspend
      parameters:
      - name: id
        in: path
        required: true
        description: The unique ID of the user to suspend.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: User successfully unpublished
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: suspendUser
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/{id}/limited:
    put:
      summary: Add limited role for a User
      tags:
      - Users
      description: 'Limit a user''s account permissions.


        ### Limited Details:

        - Requires `admin` or `moderator` privileges.

        - Assigns the `limited` role, which rate-limits notifications generated by their actions (such as publishing new posts or comments).

        - Does not restrict content creation or delete content.'
      operationId: limitUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user to limit.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: User successfully limited
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
    delete:
      summary: Remove limited for a User
      tags:
      - Users
      description: Remove the limited role, restoring the user to general privileges. Requires `admin` or `moderator` role.
      operationId: unLimitUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user to un-limit.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: User successfully un-limited
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/{id}/spam:
    put:
      summary: Add spam role for a User
      tags:
      - Users
      description: 'Flag a user as spammer.


        ### Spam Role Details:

        - Requires `admin` or `moderator` privileges.

        - Stops the user from creating new posts or comments, acting as a shadowban or block on activity.

        - Existing content remains but is hidden from search/feeds.'
      operationId: spamUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user to assign the spam role.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: Spam role assigned to the user successfully
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
    delete:
      summary: Remove spam role from a User
      tags:
      - Users
      description: Unflag a user as spammer, restoring general permissions. Requires `admin` or `moderator` role.
      operationId: unSpamUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user to remove the spam role from.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: Successfully removed the spam role from a user
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/{id}/trusted:
    put:
      summary: Add trusted role for a User
      tags:
      - Users
      description: 'Assign the trusted role to a user.


        ### Trusted Role Details:

        - Requires `admin` or `moderator` privileges.

        - Trusted users gain privileges like casting flag votes on inappropriate content or participating in priority review queues.

        - Triggers a system notification and an email to the user.'
      operationId: trustUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user to assign the trusted role.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: Trusted role assigned to the user successfully
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
    delete:
      summary: Remove trusted role from a User
      tags:
      - Users
      description: Revoke the trusted role, returning the user to general status. Requires `admin` or `moderator` role.
      operationId: unTrustUser
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the user to remove the trusted role from.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: Successfully removed the trusted role from a user
        '401':
          description: Unauthorized
        '404':
          description: Unknown User ID
      security:
      - api-key: []
      - bearer_auth: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/me:
    get:
      summary: The authenticated user
      tags:
      - Users
      description: Returned only for delegated Bearer tokens, on any Bearer-capable endpoint, when the configured JWKS endpoint cannot be reached or returns an unusable key set and no cached keys remain. Invalid tokens are 401, never 503.
      operationId: getApiUsersMe
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/MyUser'
        '401':
          description: Unauthorized
        '503':
          description: Delegated access unavailable
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserMe
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/{id}:
    get:
      summary: A User
      tags:
      - Users
      security: []
      description: 'This endpoint allows the client to retrieve a single user, either by id or by the user''s username.


        ### Path Parameter Options:

        - **id**: Can be either the user''s unique numerical ID (e.g. `123`) OR the user''s string username (e.g. `ben`).

        - Note that the returned user object schema (`ExtendedUser`) includes extended profile statistics and social link details.'
      operationId: getApiUsersById
      parameters:
      - name: id
        in: path
        required: true
        description: The user's unique numerical ID or string username.
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/ExtendedUser'
      x-operation-id-source: normalized
      x-operation-id-original: getUser
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/users/search:
    get:
      summary: Search for users
      tags:
      - Users
      description: 'Search for a user by email address.


        ### Permissions & Context:

        - Requires administrative privileges (`api-key` of an administrator).

        - Used to verify account existence or map email addresses to platform usernames.'
      operationId: searchUsers
      parameters:
      - name: email
        in: query
        required: true
        description: The exact email address of the user to search for.
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedUser'
      security:
      - api-key: []
      - bearer_auth: []
    servers:
    - url: https://dev.to
      description: Production server
  /api/users/{id}/unpublish:
    put:
      summary: Unpublish a User's Articles and Comments
      tags:
      - Users
      description: 'This endpoint allows the client to unpublish all of the articles and comments created by a user.


        ### Administrative Action:

        - Requires the authenticated user to be an Administrator.

        - This is a destructive administrative action that immediately unpublishes all posts/comments from public feeds.

        - Ideal for handling spam accounts or cleanup operations.'
      operationId: putApiUsersByIdUnpublish
      parameters:
      - name: id
        in: path
        required: true
        description: The unique numerical ID of the user whose content will be unpublished.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '204':
          description: User's articles and comments successfully unpublished
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: unpublishUser
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/admin/users:
    post:
      summary: Invite a User
      tags:
      - Users
      description: 'Invite a new user to join the platform by email.


        ### Super Admin Action:

        - Requires Super Admin privileges.

        - Triggers a system invitation flow and sends an invitation email containing a sign-up link.

        - Handy for invite-only platforms or private enterprise instances.'
      operationId: postAdminUsersCreate
      parameters: []
      responses:
        '200':
          description: Successful
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteParam'
        description: User invite params
      security:
      - api-key: []
      - bearer_auth: []
    get:
      summary: List all users (Admin)
      tags:
      - Users
      description: 'Retrieve a list of all users registered on the platform.


        ### Permissions & Filters:

        - Requires Super Admin privileges.

        - Allows filtering by exact `email` or `username`.

        - Returns paginated list of extended user objects containing email addresses, registration dates, roles, and administrative statuses.'
      parameters:
      - name: page
        in: query
        required: false
        description: Pagination page index.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of items to return per page.
        schema:
          type: integer
      - name: email
        in: query
        required: false
        description: Optional email search filter.
        schema:
          type: string
      - name: username
        in: query
        required: false
        description: Optional username search filter.
        schema:
          type: string
      responses:
        '200':
          description: successful
      security:
      - api-key: []
      - bearer_auth: []
      operationId: getApiAdminUsers
      x-operation-id-source: derived
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/admin/users/{id}:
    get:
      summary: Get user detail (Admin)
      tags:
      - Users
      description: 'Retrieve details of a single user by numerical ID.


        ### Super Admin Action:

        - Requires Super Admin privileges.

        - Includes administrative settings, audit notes, email newsletter preferences, and OAuth login identity states.'
      parameters:
      - name: id
        in: path
        required: true
        description: Unique user numeric ID.
        schema:
          type: integer
      responses:
        '200':
          description: successful
      security:
      - api-key: []
      - bearer_auth: []
      operationId: getApiAdminUsersById
      x-operation-id-source: derived
    patch:
      summary: Update user profile (Admin)
      tags:
      - Users
      description: Update a user's public profile fields (name, location, bio summary, website) on their behalf. Requires Super Admin credentials.
      parameters:
      - name: id
        in: path
        required: true
        description: Unique user ID to update.
        schema:
          type: integer
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                summary:
                  type: string
                location:
                  type: string
                website_url:
                  type: string
        description: User profile updated fields.
      security:
      - api-key: []
      - bearer_auth: []
      operationId: patchApiAdminUsersById
      x-operation-id-source: derived
    servers:
    - url: https://dev.to
      description: Production server
  /api/admin/users/{id}/email:
    put:
      summary: Update user email (Admin)
      tags:
      - Users
      description: Update a user's primary registration email address. Requires Super Admin credentials.
      parameters:
      - name: id
        in: path
        required: true
        description: Unique user ID to update email for.
        schema:
          type: integer
      responses:
        '200':
