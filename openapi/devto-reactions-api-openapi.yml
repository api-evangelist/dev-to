openapi: 3.2.0
info:
  title: Devto Reactions API
  version: 1.0.0
  description: 'Operations tagged reactions across 2 of this provider''s published API definitions: openapi.json, openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev.to/api
  description: Production server
security:
- api-key: []
tags:
- name: Reactions
paths:
  /api/reactions/toggle:
    post:
      summary: toggle reaction
      tags:
      - Reactions
      description: 'This endpoint allows the client to toggle the user''s reaction to a specified reactable (eg, Article, Comment, or User). For examples:

        * "Like"ing an Article will create a new "like" Reaction from the user for that Articles

        * "Like"ing that Article a second time will remove the "like" from the user'
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
          enum:
          - like
          - unicorn
          - exploding_head
          - raised_hands
          - fire
      - name: reactable_id
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: reactable_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - Comment
          - Article
          - User
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                result: create
                category: like
                id: 161
                reactable_id: 2260
                reactable_type: Article
        '401':
          description: unauthorized
          content:
            application/json:
              example:
                error: unauthorized
                status: 401
      operationId: postApiReactionsToggle
      x-operation-id-source: derived
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/reactions:
    post:
      summary: create reaction
      tags:
      - Reactions
      description: 'This endpoint allows the client to create a reaction to a specified reactable (eg, Article, Comment, or User). For examples:

        * "Like"ing an Article will create a new "like" Reaction from the user for that Articles

        * "Like"ing that Article a second time will return the previous "like"'
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
          enum:
          - like
          - unicorn
          - exploding_head
          - raised_hands
          - fire
      - name: reactable_id
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: reactable_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - Comment
          - Article
          - User
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                result: none
                category: like
                id: 163
                reactable_id: 2262
                reactable_type: Article
        '401':
          description: unauthorized
          content:
            application/json:
              example:
                error: unauthorized
                status: 401
      operationId: postApiReactions
      x-operation-id-source: derived
    servers:
    - url: https://dev.to/api
      description: Production server
