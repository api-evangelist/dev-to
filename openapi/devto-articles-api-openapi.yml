components:
  parameters:
    perPageParam30to1000:
      in: query
      name: per_page
      required: false
      description: Page size (the number of items to return per page). The default maximum value can be overridden by "API_PER_PAGE_MAX" environment variable.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 30
    perPageParam24to1000:
      in: query
      name: per_page
      required: false
      description: Page size (the number of items to return per page). The default maximum value can be overridden by "API_PER_PAGE_MAX" environment variable.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 24
    pageParam:
      in: query
      name: page
      required: false
      description: Pagination page
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
  schemas:
    Article:
      description: Representation of an Article to be created/updated
      type: object
      properties:
        article:
          type: object
          properties:
            title:
              type: string
            body_markdown:
              type: string
            published:
              type: boolean
              default: false
            series:
              type:
              - string
              - 'null'
            main_image:
              type:
              - string
              - 'null'
            canonical_url:
              type:
              - string
              - 'null'
            description:
              type: string
            tags:
              type: string
            organization_id:
              type:
              - integer
              - 'null'
    ArticleFlareTag:
      description: Flare tag of the article
      type: object
      properties:
        name:
          type: string
        bg_color_hex:
          description: Background color (hexadecimal)
          type:
          - string
          - 'null'
        text_color_hex:
          description: Text color (hexadecimal)
          type:
          - string
          - 'null'
    SharedOrganization:
      description: The organization the resource belongs to
      type: object
      properties:
        name:
          type: string
        username:
          type: string
