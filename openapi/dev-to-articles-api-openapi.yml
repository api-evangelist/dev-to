  /api/articles/semantic_search:
    get:
      summary: Perform a semantic fuzzy search on articles
      tags:
      - Articles
      description: Allows authenticated clients to search articles using Forem's semantic embeddings database.
      parameters:
      - name: q
        in: query
        required: true
        description: The search query term to match semantically.
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        description: Limit of articles returned (default 30, max 100).
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Pagination page index.
        schema:
          type: integer
      - name: threshold
        in: query
