openapi: 3.2.0
info:
  title: Dev To Articles API
  version: 1.0.0
  description: 'Operations tagged Articles across 3 of this provider''s published API definitions: dev-to-forem-api-openapi.yml, dev-to-forem-api-v1-openapi.json, devto-articles-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev.to/api
  description: Dev.to Production Server
- url: https://dev.to
  description: Production server
tags:
- name: Articles
  description: Endpoints for creating, reading, updating, and managing articles (blog posts, discussions, help threads) on the platform.
paths:
  /articles:
    post:
      operationId: createArticle
      summary: Publish article
      description: Creates a new article. The authenticated user will be the author of the article. The article can be published immediately or saved as a draft by setting the published field.
      tags:
      - Articles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                article:
                  type: object
                  properties:
                    title:
                      type: string
                      description: The title of the article.
                    body_markdown:
                      type: string
                      description: The body of the article in Markdown format.
                    published:
                      type: boolean
                      description: Whether the article should be published immediately.
                    series:
                      type: string
                      description: The name of a series to associate this article with.
                    main_image:
                      type: string
                      format: uri
                      description: URL for the main cover image of the article.
                    canonical_url:
                      type: string
                      format: uri
                      description: The canonical URL for the article if originally published elsewhere.
                    description:
                      type: string
                      description: A brief description or subtitle for the article.
                    tags:
                      type: array
                      items:
                        type: string
                      maxItems: 4
                      description: Up to four tags for the article.
                    organization_id:
                      type: integer
                      description: The organization ID to publish the article under.
                  required:
                  - title
      responses:
        '201':
          description: Article created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          description: Unauthorized - invalid or missing API key
        '422':
          description: Unprocessable Entity - validation errors
      security:
      - apiKey: []
    get:
      operationId: getArticles
      summary: Published articles
      description: Retrieves a list of published articles, ordered by descending popularity. This endpoint is publicly accessible and can be filtered by tag, username, state, and other parameters.
      tags:
      - Articles
      security: []
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      - name: tag
        in: query
        schema:
          type: string
        description: Filter articles by a single tag name.
      - name: tags
        in: query
        schema:
          type: string
        description: Filter articles by a comma-separated list of tag names (articles must have all specified tags).
      - name: tags_exclude
        in: query
        schema:
          type: string
        description: Exclude articles with these comma-separated tag names.
      - name: username
        in: query
        schema:
          type: string
        description: Filter articles by the author's username.
      - name: state
        in: query
        schema:
          type: string
          enum:
          - fresh
          - rising
          - all
        description: Filter articles by state. Defaults to the most popular articles.
      - name: top
        in: query
        schema:
          type: integer
        description: Return the most popular articles published in the last N days.
      - name: collection_id
        in: query
        schema:
          type: integer
        description: Return articles belonging to the specified collection.
      responses:
        '200':
          description: A list of published articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/latest:
    get:
      operationId: getLatestArticles
      summary: Published articles sorted by published date
      description: Retrieves a list of published articles sorted by publication date in descending order.
      tags:
      - Articles
      security: []
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of articles sorted by publication date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/{id}:
    get:
      operationId: getArticleById
      summary: Published article by id
      description: Retrieves a single published article by its numeric ID.
      tags:
      - Articles
      security: []
      parameters:
      - $ref: '#/components/parameters/articleIdParam'
      responses:
        '200':
          description: The requested article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
    put:
      operationId: updateArticle
      summary: Update an article by id
      description: Updates an existing article. Only the article's author or an admin can update the article.
      tags:
      - Articles
      parameters:
      - $ref: '#/components/parameters/articleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                article:
                  type: object
                  properties:
                    title:
                      type: string
                      description: The title of the article.
                    body_markdown:
                      type: string
                      description: The body of the article in Markdown format.
                    published:
                      type: boolean
                      description: Whether the article should be published.
                    series:
                      type: string
                      description: The name of a series to associate this article with.
                    main_image:
                      type: string
                      format: uri
                      description: URL for the main cover image of the article.
                    canonical_url:
                      type: string
                      format: uri
                      description: The canonical URL for the article.
                    description:
                      type: string
                      description: A brief description or subtitle for the article.
                    tags:
                      type: array
                      items:
                        type: string
                      maxItems: 4
                      description: Up to four tags for the article.
                    organization_id:
                      type: integer
                      description: The organization ID to publish the article under.
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '401':
          description: Unauthorized
        '404':
          description: Article not found
        '422':
          description: Unprocessable Entity
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/{username}/{slug}:
    get:
      operationId: getArticleByPath
      summary: Published article by path
      description: Retrieves a single published article by the author's username and the article's slug.
      tags:
      - Articles
      security: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: The username of the article's author.
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: The slug of the article.
      responses:
        '200':
          description: The requested article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me:
    get:
      operationId: getUserArticles
      summary: User's articles
      description: Retrieves all articles authored by the authenticated user.
      tags:
      - Articles
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of the authenticated user's articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me/published:
    get:
      operationId: getUserPublishedArticles
      summary: User's published articles
      description: Retrieves only published articles authored by the authenticated user.
      tags:
      - Articles
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of the authenticated user's published articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me/unpublished:
    get:
      operationId: getUserUnpublishedArticles
      summary: User's unpublished articles
      description: Retrieves only unpublished (draft) articles authored by the authenticated user.
      tags:
      - Articles
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of the authenticated user's unpublished articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/me/all:
    get:
      operationId: getUserAllArticles
      summary: User's all articles
      description: Retrieves all articles (both published and unpublished) authored by the authenticated user.
      tags:
      - Articles
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of all the authenticated user's articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '401':
          description: Unauthorized
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /articles/{id}/unpublish:
    put:
      operationId: unpublishArticle
      summary: Unpublish an article
      description: Unpublishes an article by its ID. Requires admin-level API key.
      tags:
      - Articles
      parameters:
      - $ref: '#/components/parameters/articleIdParam'
      responses:
        '204':
          description: Article unpublished successfully
        '401':
          description: Unauthorized
        '404':
          description: Article not found
      security:
      - apiKey: []
    servers:
    - url: https://dev.to/api
      description: Production server
  /organizations/{username}/articles:
    get:
      operationId: getOrgArticles
      summary: Organization's Articles
      description: Retrieves a list of articles published under the specified organization.
      tags:
      - Articles
      security: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
        description: The username (slug) of the organization.
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam30to1000'
      responses:
        '200':
          description: A list of articles from the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '404':
          description: Organization not found
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles:
    post:
      summary: Publish article
      tags:
      - Articles
      description: 'This endpoint allows the client to create a new article.


        "Articles" are all the posts that users create on DEV/Forem that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but are referred to as articles within the code.


        ### Body Parameter Tips:

        - **title**: A compelling and descriptive title for the article.

        - **body_markdown**: The main text of the article in Markdown format. You can use standard Markdown as well as Forem-specific Liquid tags (e.g., `{% embed ... %}`). You can also include YAML front matter at the very beginning of the markdown to specify metadata such as tags, series, and cover image.

        - **published**: Set to `true` to immediately publish the article and make it visible in feeds. Set to `false` (default) to save it as a draft.

        - **tags**: An array of up to 4 tag strings, e.g. `[''ruby'', ''rails'']`. Tags help categorize your post and improve discoverability.

        - **series**: Group articles together by specifying a series name. If the series does not exist, it will be created.

        - **main_image**: Absolute URL of the cover image for the article.

        - **canonical_url**: If this post was originally published elsewhere, specify the canonical URL to maintain SEO integrity.

        - **description**: A short summary of the article used for previews and SEO meta description.

        - **ai_disclosure_level**: AI tooling usage disclosure (`not_disclosed`, `no_ai`, `some_ai`, `fully_autonomous`).'
      operationId: postApiArticles
      parameters: []
      responses:
        '201':
          description: An Article
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable Entity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article_2'
        description: Representation of Article to be created
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: createArticle
    get:
      summary: Published articles
      security: []
      tags:
      - Articles
      description: 'This endpoint allows the client to retrieve a list of articles.


        "Articles" are all the posts that users create on DEV/Forem that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but are referred to as articles within the code.


        By default it will return featured, published articles ordered by descending popularity.


        It supports pagination, each page will contain `30` articles by default.


        ### Query Parameter Usage Tips:

        - **Filtering by Tags**:

        - Use `tag` to filter articles containing a single exact tag (e.g. `tag=discuss`).

        - Use `tags` to retrieve articles containing *any* of the comma-separated list of tags (e.g. `tags=javascript,css`).

        - Use `tags_exclude` to filter out articles containing any of the comma-separated list of tags (e.g. `tags_exclude=node,java`).

        - **Filtering by User / Organization**:

        - Use `username` to retrieve articles belonging to a specific User or Organization. Articles are returned in reverse chronological publication order.

        - **State Options**:

        - Use `state=fresh` to fetch fresh articles.

        - Use `state=rising` to fetch rising/trending articles.

        - Combine `state=all` with `username` to fetch up to `1000` articles (both published and unpublished) from that user/organization in a single page.

        - **Top / Popularity**:

        - Use `top=N` to return the most popular articles published in the last `N` days (e.g. `top=7` for top articles of the week, `top=30` for top of the month). This parameter can be combined with `tag` to find top articles in a specific niche.

        - **Collections**:

        - Use `collection_id` to retrieve articles belonging to a specific collection/series, sorted chronologically.'
      operationId: getApiArticles
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      - name: tag
        in: query
        required: false
        description: 'Using this parameter will retrieve articles that contain the requested tag. Articles

          will be ordered by descending popularity.This parameter can be used in conjuction with `top`.'
        schema:
          type: string
        example: discuss
      - name: tags
        in: query
        required: false
        description: 'Using this parameter will retrieve articles with any of the comma-separated tags.

          Articles will be ordered by descending popularity.'
        schema:
          type: string
        example: javascript, css
      - name: tags_exclude
        in: query
        required: false
        description: 'Using this parameter will retrieve articles that do _not_ contain _any_

          of comma-separated tags. Articles will be ordered by descending popularity.'
        schema:
          type: string
        example: node, java
      - name: username
        in: query
        required: false
        description: "Using this parameter will retrieve articles belonging\n            to a User or Organization ordered by descending publication date.\n            If `state=all` the number of items returned will be `1000` instead of the default `30`.\n            This parameter can be used in conjuction with `state`."
        schema:
          type: string
        example: ben
      - name: state
        in: query
        required: false
        description: "Using this parameter will allow the client to check which articles are fresh or rising.\n            If `state=fresh` the server will return fresh articles.\n            If `state=rising` the server will return rising articles.\n            This param can be used in conjuction with `username`, only if set to `all`."
        schema:
          type: string
          enum:
          - fresh
          - rising
          - all
        example: fresh
      - name: top
        in: query
        required: false
        description: 'Using this parameter will allow the client to return the most popular articles

          in the last `N` days.

          `top` indicates the number of days since publication of the articles returned.

          This param can be used in conjuction with `tag`.'
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 2
      - name: collection_id
        in: query
        required: false
        description: 'Adding this will allow the client to return the list of articles

          belonging to the requested collection, ordered by ascending publication date.'
        schema:
          type: integer
          format: int32
        example: 99
      responses:
        '200':
          description: A List of Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      x-operation-id-source: normalized
      x-operation-id-original: getArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/search:
    get:
      summary: Search for articles
      security: []
      tags:
      - Articles
      description: 'This endpoint allows the client to search for articles.


        ### Search Guidance:

        - **q**: The search query term. Matches against article titles, tags, and body content.

        - **top**: Restricts search results to articles published within the last `N` days.

        - **page** & **per_page**: Standard pagination support. Use this to display results sequentially on a search results page.'
      operationId: searchArticles
      parameters:
      - name: q
        in: query
        required: false
        description: The search query term. Matches against article titles, tags, and body content.
        schema:
          type: string
      - name: top
        in: query
        required: false
        description: Restricts search results to articles published within the last `N` days.
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Pagination page index.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: The number of items to return per page.
        schema:
          type: integer
      responses:
        '200':
          description: A List of Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
    servers:
    - url: https://dev.to
      description: Production server
  /api/articles/latest:
    get:
      summary: Published articles sorted by published date
      security: []
      tags:
      - Articles
      description: 'This endpoint allows the client to retrieve a list of articles ordered strictly by descending publication date.


        ### Usage Tips:

        - Bypasses all Forem/DEV feed personalization and popularity algorithms.

        - Ideal for building RSS feeds, chronological timelines, or "latest posts" widgets.

        - Supports standard `page` and `per_page` query parameters.'
      operationId: getApiArticlesLatest
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '200':
          description: A List of Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      x-operation-id-source: normalized
      x-operation-id-original: getLatestArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/{id}:
    get:
      summary: Published article by id
      security: []
      tags:
      - Articles
      description: 'This endpoint allows the client to retrieve a single published article given its unique numerical `id`.


        ### Integration Tip:

        - Returns the complete serialized article object including its HTML/markdown representation, tags, and author profile details.

        - To retrieve an article using its URL path structure instead of its numeric ID, use the `/api/articles/{username}/{slug}` endpoint.'
      operationId: getApiArticlesById
      parameters:
      - name: id
        in: path
        required: true
        description: The unique numerical ID of the published article.
        schema:
          type: integer
      responses:
        '200':
          description: An Article
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
        '404':
          description: Article Not Found
      x-operation-id-source: normalized
      x-operation-id-original: getArticleById
    put:
      summary: Update an article by id
      tags:
      - Articles
      description: 'This endpoint allows the client to update an existing article by its unique numerical `id`.


        ### Authorization Constraints:

        - The API key provided must belong to the author of the article.

        - Supports updating individual fields such as `title`, `body_markdown`, `published`, `tags`, `ai_disclosure_level`, etc.

        - Setting `published: false` on an already published article will revert it to draft status.'
      operationId: putApiArticlesById
      parameters:
      - name: id
        in: path
        required: true
        description: The unique numerical ID of the article to update.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 123
      responses:
        '200':
          description: An Article
        '404':
          description: Article Not Found
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable Entity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article_2'
        description: Representation of Article to be updated
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: updateArticle
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/{username}/{slug}:
    get:
      summary: Published article by path
      security: []
      tags:
      - Articles
      description: 'This endpoint allows the client to retrieve a single published article given its `username` and `slug` (the URL-friendly path identifier).


        ### Usage Tip:

        - Handy for resolving absolute Forem/DEV article URLs (e.g., `https://dev.to/username/slug`) into their corresponding API data models.'
      operationId: getApiArticlesByUsernameBySlug
      parameters:
      - name: username
        in: path
        required: true
        description: The username of the article's author or organization.
        schema:
          type: string
      - name: slug
        in: path
        required: true
        description: The URL-friendly slug of the article (e.g. `my-first-post-1234`).
        schema:
          type: string
      responses:
        '200':
          description: An Article
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
        '404':
          description: Article Not Found
      x-operation-id-source: normalized
      x-operation-id-original: getArticleByPath
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me:
    get:
      summary: User's articles
      tags:
      - Articles
      description: 'This endpoint allows the client to retrieve a list of published articles on behalf of an authenticated user.


        "Articles" are all the posts that users create on DEV that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but is referred to as article within the code.


        Published articles will be in reverse chronological publication order.


        It will return published articles with pagination. By default a page will contain 30 articles.'
      operationId: getApiArticlesMe
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '401':
          description: Unauthorized
        '200':
          description: A List of the authenticated user's Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me/published:
    get:
      summary: User's published articles
      tags:
      - Articles
      description: 'This endpoint allows the client to retrieve a list of published articles on behalf of an authenticated user.


        "Articles" are all the posts that users create on DEV that typically show up in the feed. They can be a blog post, a discussion question, a help thread etc. but is referred to as article within the code.


        Published articles will be in reverse chronological publication order.


        It will return published articles with pagination. By default a page will contain 30 articles.'
      operationId: getApiArticlesMePublished
      parameters:
      - $ref: '#/components/parameters/pageParam_2'
      - $ref: '#/components/parameters/perPageParam30to1000_2'
      responses:
        '401':
          description: Unauthorized
        '200':
          description: A List of the authenticated user's Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex_2'
      security:
      - api-key: []
      - bearer_auth: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserPublishedArticles
    servers:
    - url: https://dev.to/api
      description: Production server
  /api/articles/me/unpublished:
    get:
      summary: User's unpublished articles
      tags:
      - Articles
