                items:
                  $ref: '#/components/schemas/Organization'
        '404':
          description: Not Found
          content:
            application/json:
              example:
                error: not found
                status: 404
    put:
      summary: Update an organization by id
      tags:
      - Organizations
      description: This endpoint allows the client to update an existing organization.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the organization to update.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 123
      responses:
        '200':
          description: An Organization
          content:
            application/json:
              example:
                id: 580
                name: Mosciski, Moore and Moen
                profile_image: /uploads/organization/profile_image/580/7cb3619e-86f9-465a-b7af-588b0f007fd1.png
                slug: org23
                summary: An updated summary for the organization.
                tag_line: null
                url: http://will.example/lenita_gleason
        '404':
          description: organization Not Found
          content:
            application/json:
              example:
                error: not found
                status: 404
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                error: unauthorized
                status: 401
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              example:
                error: 'param is missing or the value is empty: organization'
                status: 422
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      operationId: putApiOrganizationsById
      x-operation-id-source: derived
    delete:
      summary: Delete an Organization by id
      tags:
      - Organizations
      description: This endpoint allows the client to delete a single organization, specified by id
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the organization.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                message: deletion scheduled for organization with ID 584
                status: 200
        '401':
          description: unauthorized
          content:
            application/json:
              example:
                error: unauthorized
                status: 401
      operationId: deleteApiOrganizationsById
      x-operation-id-source: derived
    servers:
    - url: https://dev.to/api
      description: Production server
