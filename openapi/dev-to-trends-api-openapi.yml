openapi: 3.2.0
info:
  title: Dev To Trends API
  version: 1.0.0
  description: 'Operations tagged trends across 2 of this provider''s published API definitions: dev-to-forem-api-v1-openapi.json, devto-trends-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://dev.to
  description: Production server
- url: https://dev.to/api
  description: Production server
tags:
- name: Trends
paths:
  /api/trends:
    get:
      summary: Trends
      security: []
      tags:
      - Trends
      description: 'Retrieve a list of active trends.


        ### Trends Overview & Score Calculation:

        - Trends represent hot topics or semantic themes currently being heavily discussed in the community.

        - They are computed by clustering semantic concept embeddings of recently published articles.

        - The `score` reflects the volume and engagement (views, comments, reactions) of articles associated with the trend.

        - Returned trends are ordered by score and recency.

        - Publicly accessible without authentication.


        It supports pagination, each page will contain 10 trends by default.'
      operationId: getTrends
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam10to1000'
      responses:
        '200':
          description: A List of Trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trend'
    servers:
    - url: https://dev.to
      description: Production server
  /api/trends/{id_or_slug}:
    get:
      summary: A Trend
      security: []
      tags:
      - Trends
      description: 'Retrieve details of a single trend using either its numeric ID or unique slug.


        ### Usage Guidance:

        - Useful for loading details of a trending topic (description, score, and slug details) to render header sections on trending tag or topic pages.'
      operationId: getTrend
      parameters:
      - name: id_or_slug
        in: path
        required: true
        description: The ID or slug of the trend to retrieve.
        example: ruby-3-4-release
        schema:
          type: string
      responses:
        '200':
          description: A Trend
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/Trend'
        '404':
          description: Trend Not Found
    servers:
    - url: https://dev.to
      description: Production server
  /api/trends/{trend_id_or_slug}/articles:
    get:
      summary: Articles in a Trend
      security: []
      tags:
      - Trends
      description: 'Retrieve a list of published articles belonging to a trend.


        ### Article Ordering & Proximity:

        - Articles are mapped to trends based on their embedding distance to the trend''s centroid.

        - Returned articles are ordered by proximity/similarity (distance) first (most relevant posts first), and then by overall article engagement score.

        - Supports pagination, each page will contain 10 articles by default.'
      operationId: getTrendArticles
      parameters:
      - name: trend_id_or_slug
        in: path
        required: true
        description: The ID or slug of the trend to retrieve articles for.
        example: ruby-3-4-release
        schema:
          type: string
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/perPageParam10to1000'
      responses:
        '200':
          description: A List of Articles in the Trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleIndex'
        '404':
          description: Trend Not Found
    servers:
    - url: https://dev.to
      description: Production server
components:
  parameters:
    pageParam:
      in: query
      name: page
      required: false
      description: Pagination page
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    perPageParam10to1000:
      in: query
      name: per_page
      required: false
      description: Page size (the number of items to return per page). The default maximum value can be overridden by "API_PER_PAGE_MAX" environment variable.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 10
