      - authentication/dev-to-authentication.yml
    x-version-selector:
      header: Accept
      value: application/vnd.forem.api-v1+json
      required: true
      note: Omitting this header routes the request to the deprecated V0 API, which answers with a 299 Warning header.
        The version is not in the path.
    x-error-envelope:
      media_type: application/json
      rfc9457: false
      shape: '{"status": <int>, "error": "<message>"}'
- target: $.paths['/reactions/toggle'].post
  description: Flag the non-idempotent twin so an agent does not retry it.
  update:
    x-idempotent: false
    x-idempotency-note: 'Toggling is state-flipping: a retry after a timeout removes the reaction the first call
      created.'
- target: $.paths['/reactions'].post
  description: Mark the one replay-safe mutation in this API.
  update:
    x-idempotent: true
    x-idempotency-note: 'Provider-documented: repeated requests return the existing reaction rather than toggling
      it off. The sibling /reactions/toggle operation is NOT replay-safe.'
