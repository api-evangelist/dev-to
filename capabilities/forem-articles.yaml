    - name: user-s-published-articles
      description: User's published articles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-articles.getuserpublishedarticles
      outputParameters:
      - type: object
        mapping: $.
    - name: user-s-unpublished-articles
      description: User's unpublished articles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-articles.getuserunpublishedarticles
      outputParameters:
      - type: object
        mapping: $.
    - name: published-article-id
      description: Published article by id
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-articles.getarticlebyid
      outputParameters:
      - type: object
        mapping: $.
    - name: update-article-id
      description: Update an article by id
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: forem-articles.updatearticle
      with:
        body: tools.body
      outputParameters:
      - type: object
