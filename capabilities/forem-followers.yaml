naftiko: 1.0.0-alpha2
info:
  label: Dev.to Forem API — Followers
  description: 'Dev.to Forem API — Followers. 1 operations. Lead operation: Followers. Self-contained Naftiko capability covering
    one Dev To business surface.'
  tags:
  - Dev To
  - Followers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEV_TO_API_KEY: DEV_TO_API_KEY
capability:
  consumes:
  - type: http
    namespace: forem-followers
    baseUri: https://dev.to/api
    description: Dev.to Forem API — Followers business capability. Self-contained, no shared references.
    resources:
    - name: followers-users
      path: /followers/users
      operations:
      - name: getfollowers
        method: GET
        description: Followers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sort
          in: query
          type: string
          description: Sort order for followers.
    authentication:
      type: apikey
      key: api-key
      value: '{{env.DEV_TO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: forem-followers-rest
    port: 8080
    description: REST adapter for Dev.to Forem API — Followers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/followers/users
      name: followers-users
      description: REST surface for followers-users.
      operations:
      - method: GET
        name: getfollowers
        description: Followers
        call: forem-followers.getfollowers
        with:
          sort: rest.sort
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: forem-followers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dev.to Forem API — Followers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: followers
      description: Followers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-followers.getfollowers
      with:
        sort: tools.sort
      outputParameters:
      - type: object
        mapping: $.
