naftiko: 1.0.0-alpha2
info:
  label: Dev.to Forem API — PodcastEpisodes
  description: 'Dev.to Forem API — PodcastEpisodes. 1 operations. Lead operation: Podcast Episodes. Self-contained Naftiko
    capability covering one Dev To business surface.'
  tags:
  - Dev To
  - PodcastEpisodes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEV_TO_API_KEY: DEV_TO_API_KEY
capability:
  consumes:
  - type: http
    namespace: forem-podcastepisodes
    baseUri: https://dev.to/api
    description: Dev.to Forem API — PodcastEpisodes business capability. Self-contained, no shared references.
    resources:
    - name: podcast_episodes
      path: /podcast_episodes
      operations:
      - name: getpodcastepisodes
        method: GET
        description: Podcast Episodes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: username
          in: query
          type: string
          description: Filter podcast episodes by the podcast owner's username.
    authentication:
      type: apikey
      key: api-key
      value: '{{env.DEV_TO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: forem-podcastepisodes-rest
    port: 8080
    description: REST adapter for Dev.to Forem API — PodcastEpisodes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/podcast-episodes
      name: podcast-episodes
      description: REST surface for podcast_episodes.
      operations:
      - method: GET
        name: getpodcastepisodes
        description: Podcast Episodes
        call: forem-podcastepisodes.getpodcastepisodes
        with:
          username: rest.username
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: forem-podcastepisodes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dev.to Forem API — PodcastEpisodes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: podcast-episodes
      description: Podcast Episodes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-podcastepisodes.getpodcastepisodes
      with:
        username: tools.username
      outputParameters:
      - type: object
        mapping: $.
