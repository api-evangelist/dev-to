  - Webhooks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEV_TO_API_KEY: DEV_TO_API_KEY
capability:
  consumes:
  - type: http
    namespace: forem-webhooks
    baseUri: https://dev.to/api
    description: Dev.to Forem API — Webhooks business capability. Self-contained, no shared references.
    resources:
    - name: webhooks
      path: /webhooks
      operations:
      - name: getwebhooks
        method: GET
        description: Webhooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createwebhook
        method: POST
        description: Create a webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: webhooks-id
      path: /webhooks/{id}
      operations:
      - name: getwebhookbyid
        method: GET
        description: A webhook endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The ID of the webhook.
          required: true
      - name: deletewebhook
        method: DELETE
        description: Delete a webhook endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The ID of the webhook.
          required: true
    authentication:
      type: apikey
      key: api-key
      value: '{{env.DEV_TO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: forem-webhooks-rest
    port: 8080
    description: REST adapter for Dev.to Forem API — Webhooks. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/webhooks
      name: webhooks
      description: REST surface for webhooks.
      operations:
      - method: GET
        name: getwebhooks
        description: Webhooks
        call: forem-webhooks.getwebhooks
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createwebhook
        description: Create a webhook
        call: forem-webhooks.createwebhook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webhooks/{id}
      name: webhooks-id
      description: REST surface for webhooks-id.
      operations:
      - method: GET
        name: getwebhookbyid
        description: A webhook endpoint
        call: forem-webhooks.getwebhookbyid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletewebhook
        description: Delete a webhook endpoint
        call: forem-webhooks.deletewebhook
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: forem-webhooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dev.to Forem API — Webhooks. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: webhooks
      description: Webhooks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-webhooks.getwebhooks
      outputParameters:
      - type: object
        mapping: $.
    - name: create-webhook
      description: Create a webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: forem-webhooks.createwebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: webhook-endpoint
      description: A webhook endpoint
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-webhooks.getwebhookbyid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-webhook-endpoint
      description: Delete a webhook endpoint
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: forem-webhooks.deletewebhook
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
