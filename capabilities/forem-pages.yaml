naftiko: 1.0.0-alpha2
info:
  label: Dev.to Forem API — Pages
  description: 'Dev.to Forem API — Pages. 5 operations. Lead operation: Show details for all pages. Self-contained Naftiko
    capability covering one Dev To business surface.'
  tags:
  - Dev To
  - Pages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DEV_TO_API_KEY: DEV_TO_API_KEY
capability:
  consumes:
  - type: http
    namespace: forem-pages
    baseUri: https://dev.to/api
    description: Dev.to Forem API — Pages business capability. Self-contained, no shared references.
    resources:
    - name: pages
      path: /pages
      operations:
      - name: getpages
        method: GET
        description: Show details for all pages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpage
        method: POST
        description: Create a new page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: pages-id
      path: /pages/{id}
      operations:
      - name: getpagebyid
        method: GET
        description: Show details for a page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The ID of the page.
          required: true
      - name: updatepage
        method: PUT
        description: Update details for a page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The ID of the page.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletepage
        method: DELETE
        description: Remove a page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: The ID of the page.
          required: true
    authentication:
      type: apikey
      key: api-key
      value: '{{env.DEV_TO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: forem-pages-rest
    port: 8080
    description: REST adapter for Dev.to Forem API — Pages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/pages
      name: pages
      description: REST surface for pages.
      operations:
      - method: GET
        name: getpages
        description: Show details for all pages
        call: forem-pages.getpages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpage
        description: Create a new page
        call: forem-pages.createpage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pages/{id}
      name: pages-id
      description: REST surface for pages-id.
      operations:
      - method: GET
        name: getpagebyid
        description: Show details for a page
        call: forem-pages.getpagebyid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatepage
        description: Update details for a page
        call: forem-pages.updatepage
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletepage
        description: Remove a page
        call: forem-pages.deletepage
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: forem-pages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dev.to Forem API — Pages. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: show-details-all-pages
      description: Show details for all pages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-pages.getpages
      outputParameters:
      - type: object
        mapping: $.
    - name: create-new-page
      description: Create a new page
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: forem-pages.createpage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: show-details-page
      description: Show details for a page
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: forem-pages.getpagebyid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-details-page
      description: Update details for a page
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: forem-pages.updatepage
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: remove-page
      description: Remove a page
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: forem-pages.deletepage
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
